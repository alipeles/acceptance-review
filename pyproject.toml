[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acceptance-tool"
version = "0.1.0"
description = "Independent acceptance review for AI-assisted software changes."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
# litellm is bounded on both sides because an unbounded resolve broke every
# recording run while replay, the suite and CI all stayed green (#278).
#   floor 1.93: the oldest release a recording run has been confirmed on; 1.96.2
#     is the other. Older ones are untested, not known bad.
#   ceiling 1.97: on Python 3.10, our floor, 1.97.0 cannot build its own
#     `ModelResponse` (`Message` is not fully defined), and 1.98 through 1.100
#     fail to import (`typing.NotRequired`). Both surface on the first live call,
#     the first as an `APIConnectionError`. 1.101 to 1.106 pass the smoke test on
#     3.10 but have not been through a recording run there.
# Before raising the ceiling, run `tests/test_litellm_smoke.py` on Python 3.10
# against the new release — CI runs 3.12, where 1.97.0 works, so CI alone will
# not catch a 3.10-only break — and make one recording run.
dependencies = [
    "pydantic>=2",
    "litellm>=1.93,<1.97",
    "markdown-it-py>=3",
    "pathspec>=0.12",
    # Loads the working directory's `.env` (#398). LiteLLM already depends on
    # it, but the CLI now calls it directly, so it is declared.
    "python-dotenv>=1.0",
    # A runtime dependency, not only a test one: the CLI imports the sandbox's
    # pytest plugin, and with no test command set the execution tier runs this
    # interpreter's `-m pytest`. Declared only under `dev`, a fresh install
    # could not start at all.
    "pytest",
]

[project.optional-dependencies]
# ruff is pinned exactly, not floated. Its default rule set widens between
# releases, so an unpinned `pip install -e ".[dev]"` silently changes what CI
# enforces — that is how 86 findings accumulated on an untouched tree (#239).
# Bumping it is a deliberate commit that clears whatever the new release adds.
dev = ["pytest", "ruff==0.16.2"]

[project.scripts]
acceptance = "acceptance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# #372's pinned BugsInPy bug list: ids and a dataset commit, not derived content.
"acceptance.benchmark.mutants" = ["pinned_bugs.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Archetype fixtures deliberately contain weak/imperfect code (circular tests,
# superficial assertions); they are data, not code held to our own standards.
#
# Markdown is excluded because ruff reformats Python code blocks inside it, and
# the snippets in the spec are didactic: `result = calculate_coupon(input);
# assert result is not None` is written on one line precisely to illustrate a
# non-discriminating test. Reflowing it edits the argument. The spec is the
# product's source of truth (§13.6) and prose is not ours to mechanically
# rewrite.
extend-exclude = ["tests/fixtures", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures holds archetype fixture data (its own task/base/head trees and
# test_*.py files) that materialize into throwaway repos — never our own suite.
addopts = "--ignore=tests/fixtures"
# Repo root on sys.path so `tests/*` modules can import shared test helpers
# (tests.support) as `tests.support` regardless of invocation style — bare
# `pytest` (CI) doesn't add cwd to sys.path the way `python -m pytest` does.
pythonpath = ["."]
